<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Paradise Admin — Offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0a0a0a;
        color: #fff;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 460px);
        padding: 32px;
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 24px;
        background: rgba(255,255,255,.04);
        text-align: center;
      }
      img { width: 72px; height: 72px; border-radius: 20px; }
      h1 { margin: 24px 0 8px; font-size: 26px; }
      p { margin: 0; color: #a3a3a3; line-height: 1.6; }
      button {
        margin-top: 24px;
        border: 0;
        border-radius: 12px;
        padding: 12px 18px;
        background: #fb5411;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/admin/icons/icon-192.png" alt="" />
      <h1>You’re offline</h1>
      <p>
        Project data is kept network-only for security. Reconnect to continue
        using Paradise Admin.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
